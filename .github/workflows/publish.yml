name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/superworldsavior/mcp-build123d

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check out audited MCP View kit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Casys-AI/mcp-platform
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .deps/mcp-platform
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Rebuild and verify committed MCP App
        env:
          MCP_VIEW_MODULE: file://${{ github.workspace }}/.deps/mcp-platform/packages/view/mod.ts
          MCP_VIEW_CONTRACTS_MODULE: file://${{ github.workspace }}/.deps/mcp-platform/packages/view-contracts/mod.ts
          MCP_VIEW_COMPONENTS_MODULE: file://${{ github.workspace }}/.deps/mcp-platform/packages/view-components/mod.ts
        run: |
          deno task build:ui
          git diff --exit-code -- src/ui/dist

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install qualified CAD runtime
        run: python -m pip install --no-cache-dir -r requirements/runtime.txt -c requirements/constraints.txt

      - name: Verify qualified CAD runtime
        run: |
          python - <<'PY'
          import build123d
          import OCP
          assert build123d.__version__ == "0.11.1"
          assert OCP.__version__ == "7.9.3.1"
          PY

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts server.ts

      - name: Run tests
        run: deno test --allow-all tests/

      - name: Validate JSR package
        run: deno publish --dry-run

  image-smoke:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build provider image for smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: mcp-build123d:smoke
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}

      - name: Verify exact Deno runtime
        run: docker run --rm --entrypoint deno mcp-build123d:smoke --version | grep -E '^deno 2\.9\.6( |$)'

      - name: Smoke HTTP, native stdio, and OCCT
        run: bash scripts/smoke-container.sh mcp-build123d:smoke

  publish-jsr:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - check
      - image-smoke
    runs-on: ubuntu-latest
    concurrency:
      group: publish-jsr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Verify release tag matches deno.json
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(deno run --allow-read scripts/release-guard.ts tag "$RELEASE_REF")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Detect an already-published JSR version
        id: jsr
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          decision="$(deno run --allow-read --allow-net scripts/release-guard.ts published "$RELEASE_VERSION")"
          case "$decision" in
            already-published|publish) ;;
            *)
              echo "::error title=Unknown JSR release decision::$decision"
              exit 1
              ;;
          esac
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Release version already exists
        if: ${{ steps.jsr.outputs.decision == 'already-published' }}
        run: echo "::notice title=JSR release unchanged::Matching version already exists; skipping upload."

      - name: Publish to JSR
        if: ${{ steps.jsr.outputs.decision == 'publish' }}
        run: deno publish

  publish-ghcr:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - check
      - image-smoke
    runs-on: ubuntu-latest
    concurrency:
      group: publish-ghcr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - name: Verify release tag matches deno.json
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(deno run --allow-read scripts/release-guard.ts tag "$RELEASE_REF")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Timestamp image metadata
        id: metadata
        shell: bash
        run: printf 'created=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Publish qualified multi-architecture provider image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.metadata.outputs.created }}
          provenance: mode=max
          sbom: true
